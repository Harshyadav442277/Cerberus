apiVersion: v1
kind: Service
metadata:
  name: cerberus-finals-public
  namespace: infra-team
spec:
  type: LoadBalancer
  externalTrafficPolicy: Cluster
  selector:
    app.kubernetes.io/name: cerberus-finals-gateway
  ports:
    - name: http
      port: 80
      targetPort: 80
      protocol: TCP
    - name: https
      port: 443
      targetPort: 443
      protocol: TCP
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cerberus-finals-gateway
  namespace: infra-team
data:
  Caddyfile: |
    cerberus-finals-13-235-125-148.sslip.io {
      encode zstd gzip

      header {
        -Server
        Strict-Transport-Security "max-age=31536000; includeSubDomains"
        X-Content-Type-Options "nosniff"
        Referrer-Policy "no-referrer"
      }

      handle_path /presenter/* {
        reverse_proxy cerberus-finals-runtime:4070
      }

      handle_path /cerberus-api/* {
        reverse_proxy cerberus-finals-runtime:4050
      }

      handle /health {
        respond "CERBERUS HOSTED" 200
      }

      respond 404
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: cerberus-finals-caddy-data
  namespace: infra-team
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: farlands-gp3
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cerberus-finals-gateway
  namespace: infra-team
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: cerberus-finals-gateway
  template:
    metadata:
      labels:
        app.kubernetes.io/name: cerberus-finals-gateway
        app.kubernetes.io/part-of: cerberus-finals
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      tolerations:
        - key: farlands.sh/nodepool
          operator: Equal
          value: infra-team-autoscale
          effect: NoSchedule
      containers:
        - name: caddy
          image: caddy:2.10.2-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
            - name: https
              containerPort: 443
          readinessProbe:
            tcpSocket:
              port: 443
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket:
              port: 80
            initialDelaySeconds: 15
            periodSeconds: 15
            failureThreshold: 4
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
            - name: caddy-data
              mountPath: /data
            - name: caddy-config
              mountPath: /config
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
              add: ["NET_BIND_SERVICE"]
      volumes:
        - name: caddyfile
          configMap:
            name: cerberus-finals-gateway
        - name: caddy-data
          persistentVolumeClaim:
            claimName: cerberus-finals-caddy-data
        - name: caddy-config
          emptyDir: {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: cerberus-finals-gateway-network
  namespace: infra-team
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: cerberus-finals-gateway
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
  egress:
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: cerberus-finals-runtime
      ports:
        - protocol: TCP
          port: 4050
        - protocol: TCP
          port: 4070
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
